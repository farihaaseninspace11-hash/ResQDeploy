version: 0.0
os: linux

files:
  - source: backend/package.json
    destination: /home/ssm-user/ResQDeploy/backend
  - source: backend/package-lock.json
    destination: /home/ssm-user/ResQDeploy/backend
  - source: backend/server-mysql.js
    destination: /home/ssm-user/ResQDeploy/backend
  - source: backend/mysqlDatabase.js
    destination: /home/ssm-user/ResQDeploy/backend
  - source: backend/routes/incidents-mysql.js
    destination: /home/ssm-user/ResQDeploy/backend/routes
  - source: backend/routes/resources-mysql.js
    destination: /home/ssm-user/ResQDeploy/backend/routes
  - source: backend/routes/teams-mysql.js
    destination: /home/ssm-user/ResQDeploy/backend/routes
  - source: backend/routes/dashboard-mysql.js
    destination: /home/ssm-user/ResQDeploy/backend/routes
  - source: frontend/index.html
    destination: /var/www/resqdeploy
  - source: frontend/script.js
    destination: /var/www/resqdeploy
  - source: frontend/style.css
    destination: /var/www/resqdeploy

hooks:
  ApplicationStop:
    - location: scripts/stop_application.sh
      timeout: 60
      runas: root

  BeforeInstall:
    - location: scripts/backup_current_release.sh
      timeout: 60
      runas: root

  AfterInstall:
    - location: scripts/install_dependencies.sh
      timeout: 600
      runas: root

  ApplicationStart:
    - location: scripts/start_application.sh
      timeout: 120
      runas: root

  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 180
      runas: root
