name: ResQDeploy CI/CD Pipeline

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master


jobs:

  # ==========================================
  # TEST JOB
  # ==========================================
  test:

    name: Test

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # 1. Checkout source code
      # ----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------
      # 2. Setup Node.js
      # ----------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json


      # ----------------------------------------
      # 3. Install backend dependencies
      # ----------------------------------------
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci


      # ----------------------------------------
      # 4. Validate backend
      # ----------------------------------------
      - name: Validate backend
        working-directory: backend
        run: node --check server.js


      # ----------------------------------------
      # 5. Run backend tests
      # ----------------------------------------
      - name: Run backend tests
        working-directory: backend
        run: npm test --if-present


      # ----------------------------------------
      # 6. Validate frontend
      # ----------------------------------------
      - name: Validate frontend
        run: |
          test -f frontend/index.html
          test -f frontend/style.css
          test -f frontend/script.js


      # ----------------------------------------
      # 7. Prepare deployment package
      # ----------------------------------------
      - name: Prepare deployment package
        run: |
          mkdir -p deployment
          cp -r backend deployment/
          cp -r frontend deployment/
          cp -r database deployment/


      # ----------------------------------------
      # 8. Upload deployment artifact
      # ----------------------------------------
      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: resqdeploy-build
          path: deployment/


  # ==========================================
  # DEPLOY JOB
  # ==========================================
  deploy:

    name: Deploy

    needs: test

    runs-on: ubuntu-latest

    if: github.event_name == 'push'

    steps:

      # ----------------------------------------
      # 1. Download build artifact
      # ----------------------------------------
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: resqdeploy-build
          path: deployment


      # ----------------------------------------
      # 2. Verify deployment package
      # ----------------------------------------
      - name: Verify deployment package
        run: |
          echo "Checking ResQDeploy deployment package..."
          echo ""
          echo "Backend:"
          ls -la deployment/backend
          echo ""
          echo "Frontend:"
          ls -la deployment/frontend
          echo ""
          echo "Database:"
          ls -la deployment/database


      # ----------------------------------------
      # 3. Deployment placeholder
      # ----------------------------------------
      - name: Deployment Ready
        run: |
          echo "=========================================="
          echo "ResQDeploy deployment pipeline successful"
          echo "=========================================="
          echo "AWS deployment will be connected later."